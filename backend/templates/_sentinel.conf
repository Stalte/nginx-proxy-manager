  # Sentinel security rules (see /etc/nginx/conf.d/sentinel.conf)
  set $corvus_wr "-";
  set $corvus_rule "";
  set $corvus_cc "";
  set $corvus_body "";
  set $corvus_ban "";
  set $corvus_skip "";
  set $corvus_auth "off";
  set $corvus_user "";
  set $corvus_key "{% if sentinel_key %}{{ sentinel_key }}{% else %}{{ id }}{% endif %}";
  rewrite_by_lua_file /etc/nginx/lua/corvus/host.lua;
{% unless sentinel_key %}
  log_by_lua_file /etc/nginx/lua/corvus/hostlog.lua;
  # Sentinel rate limit of this host, if any (written by the backend)
  include /data/sentinel/hosts/{{ id }}[.]conf;
{% endunless %}

  # Sentinel browser challenge: the challenge page posts its answer here
  location = /__corvus/challenge/verify {
    content_by_lua_file /etc/nginx/lua/corvus/verify.lua;
  }
