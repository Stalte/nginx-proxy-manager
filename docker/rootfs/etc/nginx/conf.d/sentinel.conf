# Sentinel security engine (http level).
#
# The request filtering runs in Lua (/etc/nginx/lua/corvus, from the Corvus project,
# Apache-2.0). Each proxy and redirection host calls it from its server block
# (backend/templates/_sentinel.conf); /data/sentinel/rules.json is written by the
# backend and loaded once per (re)load, before the workers start.

lua_package_path "/etc/nginx/lua/?.lua;;";

# Shared state between workers (used by later Sentinel features; small when empty).
lua_shared_dict corvus_bans 16m;   # banned client addresses
lua_shared_dict corvus_bb 16m;     # bad-behaviour counters per client and host
lua_shared_dict corvus_bb_q 2m;    # bad-behaviour settings and pending bans
lua_shared_dict corvus_ua 1m;      # "under attack" activations and exemptions
lua_shared_dict corvus_signin 4m;  # login page session versions
lua_shared_dict corvus_traffic 4m; # per-host request counters (automatic under attack mode)

# Run the rules at the start of the rewrite phase, before a location's own "return" or
# "rewrite" (redirection hosts answer with "return", which would otherwise come first).
rewrite_by_lua_no_postpone on;

# Cap PCRE backtracking so a pathological rule pattern cannot stall a worker.
lua_regex_match_limit 100000;

init_by_lua_block {
	require("corvus.rules").init("/data/sentinel/rules.json")
}

# Known scanner / exploit request patterns, checked by Sentinel for hosts with
# "Block Common Exploits" on (in addition to conf.d/include/block-exploits.conf).
# Matched against the raw request line and the decoded path, so percent-encoded
# variants are caught. All patterns are linear-time.
map "$request_uri $uri" $corvus_exploit {
	default "";
	"~*(?:\.|%2e|%252e)(?:\.|%2e|%252e)(?:[/\x5c]|%2f|%5c|%252f|%255c)"                 "traversal";
	"~*/\.(?:env|git|svn|hg|htpasswd|htaccess|ds_store|aws|ssh)(?:[/?\s]|$)"          "dotfile";
	"~*/(?:wp-config\.php|phpmyadmin|vendor/phpunit|cgi-bin/|boaform|hnap1|actuator/(?:env|heapdump))" "scanner";
	"~*^/@fs/"                                                                          "scanner";
	"~*(?:union(?:\s|%20|\+)+(?:all(?:\s|%20|\+)+)?select|information_schema|(?:sleep|benchmark)(?:\(|%28))" "sqli";
	"~*(?:<script|%3cscript|javascript:|onerror(?:=|%3d))"                             "xss";
	"~*(?:etc/passwd|proc/self/environ|pearcmd)"                                        "lfi";
	"~*(?:php|phar|expect|data)(?::|%3a)(?:/|%2f)(?:/|%2f)"                             "lfi";
	"~*(?:allow_url_include|auto_prepend_file|auto_append_file)(?:=|%3d)"              "php-cgi";
	"~*[?&+]%ad[a-z]"                                                                   "php-cgi";
	"~*(?:<|%3c)(?:\?|%3f)(?:php|=|%3d)"                                                "php-code";
	"~*(?:\$\{jndi:|%24%7bjndi)"                                                         "log4shell";
}

# Status port, loopback only: the backend reads the traffic counters and pushes the
# automatic "under attack" activations here. Every request also needs the status key
# from /data/sentinel/secrets.json (header X-Corvus-Status-Key).
server {
	listen 127.0.0.1:9180;
	server_name sentinel-status;
	access_log off;
	allow 127.0.0.1;
	deny all;

	location = /traffic {
		content_by_lua_file /etc/nginx/lua/corvus/status-traffic.lua;
	}
	location = /under-attack {
		client_max_body_size 1m;
		client_body_buffer_size 1m;
		content_by_lua_file /etc/nginx/lua/corvus/status-underattack.lua;
	}
	location / {
		return 404;
	}
}
